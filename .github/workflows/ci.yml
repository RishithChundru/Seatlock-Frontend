name: CI

# Vercel deploys automatically through its GitHub integration (a preview per PR, production on main).
# This workflow is the quality gate: lint plus a production build (which type-checks) on every push and PR.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build # also type-checks
        env:
          NEXT_PUBLIC_API_URL: https://api.example.invalid
